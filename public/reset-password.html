<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#111111" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>Сброс пароля — EL-DUCK VPN</title>
    <link rel="icon" type="image/x-icon" href="/assets/icons/favicon.ico?v=20260417-1" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #000; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .container { max-width: 380px; width: 100%; padding: 24px; }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo img { width: 96px; height: auto; }
        h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
        .subtitle { font-size: 13px; color: #888; text-align: center; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; display: flex; flex-direction: column; gap: 8px; }
        .form-group label { font-size: 13px; color: #aaa; font-weight: 500; }
        .password-input-wrap { position: relative; display: flex; align-items: center; }
        .form-group input[type="password"],
        .form-group input[type="text"] {
            width: 100%; padding: 12px 44px 12px 12px; background: #0a0a0a; border: 1px solid #333;
            color: #fff; font-size: 14px; outline: none; transition: border-color 0.2s;
        }
        .form-group input:focus { border-color: #fff; }
        .password-toggle {
            position: absolute; right: 1px; top: 1px; bottom: 1px; width: 40px;
            display: flex; align-items: center; justify-content: center;
            background: transparent; border: none; color: #888; cursor: pointer; padding: 0;
        }
        .password-toggle:hover { color: #fff; }
        .btn-primary {
            width: 100%; padding: 16px 24px; background: #fff; color: #000; border: none;
            font-size: 15px; font-weight: 600; cursor: pointer; transition: all 0.2s;
        }
        .btn-primary:active { background: #ccc; }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-link {
            background: none; border: none; color: #888; font-size: 13px;
            cursor: pointer; padding: 8px; transition: color 0.2s; display: block;
            width: 100%; text-align: center;
        }
        .btn-link:hover { color: #fff; }
        .error-box { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.2); padding: 12px 16px; font-size: 13px; color: #ef4444; line-height: 1.5; margin-bottom: 12px; }
        .success-box { background: rgba(76,175,80,0.08); border: 1px solid rgba(76,175,80,0.2); padding: 12px 16px; font-size: 13px; color: #4caf50; line-height: 1.5; margin-bottom: 12px; }
        .loading { text-align: center; padding: 40px 0; }
        .spinner { display: inline-block; width: 24px; height: 24px; border: 2px solid #333; border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
        .form-hint { font-size: 14px; color: #ccc; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/assets/brand/logo.svg" alt="EL-DUCK" />
        </div>

        <div id="loadingState" class="loading">
            <div class="spinner"></div>
            <p style="margin-top:12px;color:#999;">Проверка ссылки...</p>
        </div>

        <div id="errorState" class="hidden">
            <h1>Ошибка</h1>
            <p class="subtitle" id="errorMessage">Ссылка устарела или недействительна.</p>
            <a href="/" class="btn-link">Вернуться на главную</a>
        </div>

        <div id="resetFormState" class="hidden">
            <h1>Новый пароль</h1>
            <p class="subtitle">Введите новый пароль для аккаунта <span id="emailDisplay"></span></p>
            <form id="resetForm">
                <div id="formError" class="error-box hidden"></div>
                <div class="form-group">
                    <label for="newPassword">Новый пароль</label>
                    <div class="password-input-wrap">
                        <input type="password" id="newPassword" name="password" placeholder="Минимум 6 символов" required minlength="6" autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="newPassword" aria-label="Показать пароль">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Подтвердите пароль</label>
                    <div class="password-input-wrap">
                        <input type="password" id="confirmPassword" name="passwordConfirm" placeholder="Повторите пароль" required minlength="6" autocomplete="new-password" />
                        <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Показать пароль">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="submitBtn">
                    <span id="submitText">Сбросить пароль</span>
                    <span id="submitLoader" class="hidden">⏳</span>
                </button>
            </form>
        </div>

        <div id="successState" class="hidden">
            <h1>Пароль изменён</h1>
            <p class="subtitle">Вы будете перенаправлены на главную страницу...</p>
            <a href="/" class="btn-link">Перейти на главную</a>
        </div>
    </div>

    <script src="/reset-password.js" defer></script>
</body>
</html>
